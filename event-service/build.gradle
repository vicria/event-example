plugins {
    id("application")
}

application {
    mainClass = 'ru.vicria.event.service.EventApp'
    distTar.archiveFileName = 'app.tar'
    distZip.enabled = false
}

group = "ru.vicria"
version = "1.0-SNAPSHOT"

repositories {
    mavenCentral()
}

dependencies {
    implementation project(":event-service-api")
    implementation 'com.google.protobuf:protobuf-java:4.28.2'
    implementation "io.grpc:grpc-stub:1.63.0"
    implementation "io.grpc:grpc-protobuf:1.63.0"
    implementation 'io.grpc:grpc-netty-shaded:1.75.0'
    implementation "com.salesforce.servicelibs:reactor-grpc-stub:1.2.4"

    implementation "org.slf4j:slf4j-api:1.7.30"
    implementation("ch.qos.logback:logback-classic:1.5.6")

    implementation "org.mongodb:mongodb-driver-sync:5.4.0"

    implementation "io.projectreactor:reactor-core:3.4.7"

    testImplementation(platform("org.junit:junit-bom:5.10.0"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testImplementation(platform("org.testcontainers:testcontainers-bom:1.21.4"))
    testImplementation("org.testcontainers:junit-jupiter")
    testImplementation("org.testcontainers:mongodb")
    testImplementation "org.mockito:mockito-core:5.11.0"
    testImplementation "org.mockito:mockito-junit-jupiter:5.11.0"
    testImplementation "org.assertj:assertj-core:3.25.3"
}

tasks.test {
    useJUnitPlatform()
}
